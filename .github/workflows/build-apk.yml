name: Build RK Server APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Prepare source folder
        shell: bash
        run: |
          if [ -f "app/build.gradle" ]; then
            echo "SOURCE_DIR=." >> "$GITHUB_ENV"
          elif [ -f "RK-Server-Source.zip" ]; then
            mkdir -p .rk-build-src
            unzip -q -o RK-Server-Source.zip -d .rk-build-src
            if [ -f ".rk-build-src/rk-server-android/app/build.gradle" ]; then
              echo "SOURCE_DIR=.rk-build-src/rk-server-android" >> "$GITHUB_ENV"
            elif [ -f ".rk-build-src/app/build.gradle" ]; then
              echo "SOURCE_DIR=.rk-build-src" >> "$GITHUB_ENV"
            else
              echo "Tidak menemukan app/build.gradle di source ZIP" >&2
              exit 1
            fi
          else
            echo "Tidak menemukan app/build.gradle atau RK-Server-Source.zip" >&2
            exit 1
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: ${{ env.SOURCE_DIR }}
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RK-Server-APK
          path: ${{ env.SOURCE_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
